<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (window.localStorage.getItem("x10-developer-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var lang = window.localStorage.getItem("x10-developer-language");
          var valid = ["en", "th", "zh", "ko", "ja", "es", "fr"];
          if (valid.indexOf(lang) === -1) lang = "en";
          document.documentElement.lang = lang;
          document.documentElement.setAttribute("data-lang", lang);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var lang = document.documentElement.getAttribute("data-lang");
        var fontMap = {
          th: "Noto+Sans+Thai:wght@400;500;600;700",
          zh: "Noto+Sans+SC:wght@400;500;600;700",
          ko: "Noto+Sans+KR:wght@400;500;600;700",
          ja: "Noto+Sans+JP:wght@400;500;600;700",
        };
        if (fontMap[lang]) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "https://fonts.googleapis.com/css2?family=" + fontMap[lang] + "&display=swap";
          document.head.appendChild(link);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/images/x10-developer-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>X10 Developer — Keyboard shortcuts for working without a mouse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
